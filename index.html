<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products</title>
<script type="text/javascript">
  var page_name = "Products - Web";
</script>
<script type="text/javascript">
  // siteId comes from the URL (?siteId=sdkdemo26621z), default sdkdemo26621z; it is carried on every link.
  var params = new URLSearchParams(location.search);
  var siteId = params.get('siteId') || 'sdkdemo26621z';
  if (!/^[a-z0-9-]+$/i.test(siteId)) siteId = 'sdkdemo26621z';
  function withSiteId(url) {
    return url + (url.indexOf('?') < 0 ? '?' : '&') + 'siteId=' + encodeURIComponent(siteId);
  }
</script>
<script type="text/javascript">
  // Builds: <script type="text/javascript" id="" src="https://<siteId>.btttag.com/btt.js"><\/script>
  (function () {
    var s = document.createElement('script');
    s.type = 'text/javascript';
    s.id = '';
    s.src = 'https://' + siteId + '.btttag.com/btt.js';
    document.head.appendChild(s);
  })();
</script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
  header { background: #222; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header a { color: #fff; }
  main { padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; }
  .card img { width: 100%; height: 160px; object-fit: contain; }
  .card h3 { font-size: 16px; margin: 10px 0 6px; }
  .card p { font-size: 13px; color: #666; flex: 1; }
  .price { font-weight: bold; font-size: 18px; margin-bottom: 8px; }
  button { padding: 8px 12px; background: #0066cc; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { color: #c00; }
</style>
</head>
<body>
<header>
  <strong>BTT Ecom Demo</strong>
  <a href="cart.html" id="cartLink">View Cart</a>
</header>
<main>
  <h2>Products</h2>
  <p id="msg">Loading...</p>
  <div class="grid" id="products"></div>
</main>

<script>
  // Keep siteId on links to the other pages.
  document.querySelectorAll('a[href$=".html"]').forEach(function (a) {
    a.href = withSiteId(a.getAttribute('href'));
  });

  // View Cart → cart.html?siteId=...&cartId=...&redirectToHome=true
  function updateCartLink() {
    const id = localStorage.getItem('cartId');
    document.getElementById('cartLink').href =
      withSiteId('cart.html') + (id ? '&cartId=' + encodeURIComponent(id) : '') + '&redirectToHome=true';
  }
  updateCartLink();
  const API = 'https://btt-api.ganeshw-aloha.workers.dev/btriangle/api';  // Cloudflare Worker proxy (adds CORS, forwards to http://34.31.235.63:8000)

  async function loadProducts() {
    try {
      const res = await fetch(API + '/product/?format=json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const products = await res.json();
      document.getElementById('msg').textContent = '';
      const grid = document.getElementById('products');
      products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img alt="">
          <h3></h3>
          <p></p>
          <div class="price">$${p.price}</div>
          <button>Add to Cart</button>`;
        const img = card.querySelector('img');
        img.src = p.image;
        img.onerror = () => { img.onerror = null; img.style.visibility = 'hidden'; };
        card.querySelector('h3').textContent = p.name;
        card.querySelector('p').textContent = p.description;
        card.querySelector('button').onclick = e => addToCart(p, e.target);
        grid.appendChild(card);
      });
    } catch (e) {
      document.getElementById('msg').textContent = 'Failed to load products: ' + e.message;
    }
  }

  // Create a cart on the first add and remember its id in localStorage.
  async function getCartId() {
    let cartId = localStorage.getItem('cartId');
    if (!cartId) {
      const res = await fetch(API + '/cart/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      });
      if (!res.ok) throw new Error('Create cart failed: HTTP ' + res.status);
      cartId = (await res.json()).id;
      localStorage.setItem('cartId', cartId);
      updateCartLink();
    }
    return cartId;
  }

  async function addToCart(product, btn) {
    btn.disabled = true;
    try {
      const cartId = await getCartId();
      const body = new URLSearchParams({ product: product.id, quantity: 1, price: product.price, cart: cartId });
      const res = await fetch(API + '/item/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString(),
      });
      if (!res.ok) {
        localStorage.removeItem('cartId'); // cart may be stale; next add creates a new one
        updateCartLink();
        throw new Error('Add item failed: HTTP ' + res.status);
      }
      btn.textContent = 'Added ✓';
      setTimeout(() => { btn.textContent = 'Add to Cart'; }, 1500);
    } catch (e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  loadProducts();
</script>
</body>
</html>
